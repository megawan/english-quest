<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#58cc02" />
    <meta name="description" content="English Quest: learn English the fun way with XP, levels, streaks, and badges." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>" />
    <title>English Quest</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>English Quest needs JavaScript. / English Quest membutuhkan JavaScript.</noscript>
    <script>
      // If the app never mounts, the site is most likely being served from the
      // source branch instead of the GitHub Actions build. Say so instead of
      // leaving a blank page.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.children.length) {
            root.innerHTML =
              '<div style="font-family:system-ui,sans-serif;max-width:480px;margin:48px auto;padding:0 16px;line-height:1.5">' +
              '<h2>English Quest</h2>' +
              '<p>The app could not start. If you are the site owner: open <b>Settings &rarr; Pages</b> and set <b>Source</b> to <b>GitHub Actions</b>, then re-run the deploy workflow.</p>' +
              '<p>Aplikasi tidak bisa dimulai. Jika kamu pemilik situs: buka <b>Settings &rarr; Pages</b>, ubah <b>Source</b> ke <b>GitHub Actions</b>, lalu jalankan ulang workflow deploy.</p>' +
              '</div>';
          }
        }, 2500);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
