<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="English Quest: upper-intermediate (B2) English with XP, streaks, and achievements." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M22 18h22M22 32h17M22 46h22M22 18v28' stroke='white' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <title>English Quest</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>English Quest needs JavaScript. / English Quest membutuhkan JavaScript.</noscript>
    <script>
      // If the app never mounts, the site is most likely being served from the
      // source branch instead of the GitHub Actions build. Say so instead of
      // leaving a blank page.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && !root.children.length) {
            root.innerHTML =
              '<div style="font-family:system-ui,sans-serif;max-width:480px;margin:48px auto;padding:0 16px;line-height:1.5">' +
              '<h2>English Quest</h2>' +
              '<p>The app could not start. If you are the site owner: open <b>Settings &rarr; Pages</b> and set <b>Source</b> to <b>GitHub Actions</b>, then re-run the deploy workflow.</p>' +
              '<p>Aplikasi tidak bisa dimulai. Jika kamu pemilik situs: buka <b>Settings &rarr; Pages</b>, ubah <b>Source</b> ke <b>GitHub Actions</b>, lalu jalankan ulang workflow deploy.</p>' +
              '</div>';
          }
        }, 2500);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
